# Configurazione di golangci-lint v2 per l'API Remotek (ADR-0012, REGOLE 6.3).
# Versione dello strumento: quella fissata in .github/workflows/remotek-ci.yml.
# Due usi: job `lint` (bloccante) sui soli pacchetti elencati in
# .github/lint-bonificati.txt, job `lint-tutto` (informativo) su tutto il repo.
# Niente --new-from-rev: il debito ereditato deve restare visibile.
version: "2"

run:
  timeout: 10m
  tests: true

issues:
  # Il predefinito (true) tiene un solo finding per riga: dove due linter
  # segnalano la stessa riga (errcheck e gosec G104, ineffassign e SA4006,
  # errorlint e ST1005) il secondo sparisce, anche quando e' un altro difetto.
  # Il job bloccante non cambia esito: una riga segnalata fallisce comunque.
  uniq-by-line: false

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
  settings:
    misspell:
      locale: US # i commenti nuovi sono in italiano: misspell guarda solo parole inglesi note
    gosec:
      excludes:
        - G115 # conversioni tra interi: rumoroso sul codice ereditato, si rivaluta a bonifica finita
    revive:
      # Con una lista rules non vuota revive esegue solo le regole elencate:
      # senza questa riga, con la sola exported disabilitata, non controllava nulla.
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true # 23k righe ereditate senza doc-comment: si attiva modulo per modulo
        # Stessi controlli di ST1000 e ST1003, spenti in staticcheck qui sotto:
        # una scelta sola per controllo, e se cambia si riaccendono insieme.
        - name: package-comments
          disabled: true # come -ST1000: la package doc non e' obbligatoria
        - name: var-naming
          disabled: true # come -ST1003: nomi ereditati (Id, Url, underscore) usati in tutto il repo
    staticcheck:
      # -QF1008: i selettori espliciti (service.AllService.AddressBookService.Create)
      # dicono quale servizio si usa e servono a sostituire AllService con servizi
      # passati esplicitamente (REGOLE 10.2); abbreviarli lo nasconde.
      checks: ["all", "-ST1000", "-ST1003", "-QF1008"] # niente package doc obbligatoria; nomi con underscore ereditati; selettori espliciti
  exclusions:
    generated: lax
    presets:
      - std-error-handling
      - common-false-positives
    paths:
      - docs/ # swagger generato
      - resources/
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      # Cambia quando il module path diventa nostro (decisione del Passo 3, con ADR).
      local-prefixes:
        - github.com/lejianwen/rustdesk-api
  exclusions:
    generated: lax
    paths:
      - docs/
      - resources/
