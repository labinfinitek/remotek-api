# Rilascio dell'API Remotek (REGOLE 7 e 11): sul tag api-vX.Y.Z costruisce
# l'immagine dal Dockerfile, la scansiona con trivy (CRITICAL e HIGH con una
# correzione disponibile fermano il rilascio), la pubblica su
# ghcr.io/labinfinitek/remotek-api come :X.Y.Z e :X.Y, ne attesta la
# provenienza e crea la GitHub Release con le note del CHANGELOG, l'SBOM
# CycloneDX e l'inventario delle licenze.
#
# Due job: "immagine" ha solo permessi di lettura e fuori dal tag fa da prova
# (a mano, o nelle MR che cambiano questo file): costruisce, scansiona e fa
# l'SBOM senza pubblicare nulla, con le note di "Non rilasciato". "pubblica" gira solo sul
# tag e ha i permessi di scrittura.
#
# Se trivy ferma un tag, il tag resta e non si pubblica: si corregge e si
# rilascia la patch successiva. Un tag non si sposta mai.
#
# Regole di questo file: azioni pinnate a SHA con la versione in commento,
# strumenti scaricati dalle release e verificati con lo sha256 pubblicato
# dalla release stessa (trivy, syft), permessi minimi per job, nessun cron.
name: remotek-release

on:
  push:
    tags: ["api-v*"]
  # La prova del job immagine: a mano da remotek, e in ogni MR che cambia
  # questo file (workflow_dispatch vale solo per i file gia' sul branch
  # predefinito, quindi una MR nuova non potrebbe provarsi altrimenti).
  pull_request:
    branches: [remotek]
    paths: [".github/workflows/remotek-release.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMMAGINE: ghcr.io/labinfinitek/remotek-api

jobs:
  immagine:
    name: immagine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      versione: ${{ steps.versione.outputs.versione }}
      minore: ${{ steps.versione.outputs.minore }}
    env:
      TRIVY_VERSION: 0.74.0
      TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
      SYFT_VERSION: 1.52.0
      SYFT_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # per controllare che il tag stia sulla storia di remotek
          persist-credentials: false
      - name: Versione dal tag
        id: versione
        env:
          EVENTO: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${EVENTO}" != "push" ]; then
            # prova a mano: niente tag, le note sono quelle di "Non rilasciato"
            echo "versione=0.0.0-prova" >> "${GITHUB_OUTPUT}"
            echo "minore=0.0" >> "${GITHUB_OUTPUT}"
            echo "titolo=Non rilasciato" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if ! [[ "${TAG}" =~ ^api-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::il tag ${TAG} non ha la forma api-vX.Y.Z"
            exit 1
          fi
          git fetch --no-tags origin remotek
          if ! git merge-base --is-ancestor HEAD origin/remotek; then
            echo "::error::il tag ${TAG} non sta sulla storia di remotek: si rilascia solo dal commit di merge della MR di rilascio"
            exit 1
          fi
          versione="${TAG#api-v}"
          echo "versione=${versione}" >> "${GITHUB_OUTPUT}"
          echo "minore=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "${GITHUB_OUTPUT}"
          echo "titolo=${versione}" >> "${GITHUB_OUTPUT}"
      - name: Note dal CHANGELOG
        env:
          TITOLO: ${{ steps.versione.outputs.titolo }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/rilascio"
          # la sezione "## [<titolo>]" fino alla successiva "## ["
          awk -v t="## [${TITOLO}]" 'index($0, t) == 1 { f = 1; next } f && /^## \[/ { exit } f' \
            CHANGELOG.md > "${RUNNER_TEMP}/rilascio/note.md"
          if ! grep -q '[^[:space:]]' "${RUNNER_TEMP}/rilascio/note.md"; then
            echo "::error::CHANGELOG.md non ha la sezione ## [${TITOLO}], o e' vuota"
            exit 1
          fi
      - name: Installa trivy e syft
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          curl -fsSL --retry 3 -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          curl -fsSL --retry 3 -o syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum -c -
          mkdir -p bin
          tar -xzf trivy.tar.gz -C bin trivy
          tar -xzf syft.tar.gz -C bin syft
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: docker build
        env:
          VERSIONE: ${{ steps.versione.outputs.versione }}
        run: |
          docker build --build-arg VERSION="${VERSIONE}" --build-arg REVISION="${GITHUB_SHA}" \
            -t "${IMMAGINE}:${VERSIONE}" .
      - name: trivy
        env:
          VERSIONE: ${{ steps.versione.outputs.versione }}
        run: |
          set -euo pipefail
          # Tutto nel log, anche cio' che non ha ancora una correzione...
          trivy image --no-progress --scanners vuln,secret --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            "${IMMAGINE}:${VERSIONE}"
          # ...ma ferma il rilascio solo cio' che si puo' correggere.
          trivy image --no-progress --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 "${IMMAGINE}:${VERSIONE}"
      - name: SBOM e inventario delle licenze
        env:
          VERSIONE: ${{ steps.versione.outputs.versione }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/rilascio"
          sbom="remotek-api-${VERSIONE}.cdx.json"
          syft scan "docker:${IMMAGINE}:${VERSIONE}" -o "cyclonedx-json=${sbom}"
          {
            printf 'componente\tversione\tlicenze\n'
            jq -r '.components[]? | [.name, (.version // ""),
                ([.licenses[]? | .license.id // .license.name // .expression] | join(" OR "))] | @tsv' \
              "${sbom}" | sort -u
          } > "remotek-api-${VERSIONE}-licenze.tsv"
          echo "componenti: $(jq '.components | length' "${sbom}")"
          echo "senza licenza dichiarata: $(awk -F'\t' 'NR > 1 && $3 == ""' "remotek-api-${VERSIONE}-licenze.tsv" | wc -l)"
      - name: Salva l'immagine
        env:
          VERSIONE: ${{ steps.versione.outputs.versione }}
        run: docker save "${IMMAGINE}:${VERSIONE}" | gzip > "${RUNNER_TEMP}/rilascio/immagine.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rilascio
          path: ${{ runner.temp }}/rilascio/
          if-no-files-found: error
          retention-days: 7

  pubblica:
    name: pubblica
    needs: immagine
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/api-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # GitHub Release
      packages: write # push su ghcr.io
      id-token: write # attestazione firmata con Sigstore
      attestations: write
    env:
      VERSIONE: ${{ needs.immagine.outputs.versione }}
      MINORE: ${{ needs.immagine.outputs.minore }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rilascio
          path: ${{ runner.temp }}/rilascio
      - name: Push su ghcr.io
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTORE: ${{ github.actor }}
        run: |
          set -euo pipefail
          gunzip -c "${RUNNER_TEMP}/rilascio/immagine.tar.gz" | docker load
          rm "${RUNNER_TEMP}/rilascio/immagine.tar.gz"
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${ATTORE}" --password-stdin
          docker tag "${IMMAGINE}:${VERSIONE}" "${IMMAGINE}:${MINORE}"
          docker push "${IMMAGINE}:${VERSIONE}"
          docker push "${IMMAGINE}:${MINORE}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMMAGINE}:${VERSIONE}")"
          digest="${digest#*@}"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::digest non valido: ${digest}"; exit 1; }
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMMAGINE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true # usa il login di docker del passo prima
      - name: docker logout
        if: always()
        run: docker logout ghcr.io
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/rilascio"
          {
            cat note.md
            echo
            echo "## Immagine"
            echo
            echo "- \`${IMMAGINE}:${VERSIONE}@${DIGEST}\`"
            echo "- Verifica della provenienza: \`gh attestation verify oci://${IMMAGINE}:${VERSIONE} --owner labinfinitek\`"
            echo "- Allegati: SBOM CycloneDX dell'immagine e inventario delle licenze."
          } > note-release.md
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "Remotek API ${VERSIONE}" --notes-file note-release.md \
            "remotek-api-${VERSIONE}.cdx.json" "remotek-api-${VERSIONE}-licenze.tsv"
