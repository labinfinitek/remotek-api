# CI dell'API Remotek (REGOLE 7): segreti, go.sum, test, govulncheck, lint,
# audit dei workflow, Dockerfile (hadolint e build senza push). Immagine
# pubblicata, trivy e SBOM stanno in remotek-release.yml, sul tag api-v*.
#
# Regole di questo file: azioni pinnate a SHA con la versione in commento
# (si aggiornano con pinact), permessi minimi per job, nessun cron, nessun tag.
name: remotek-ci

on:
  push:
    branches: [remotek]
  pull_request:
    branches: [remotek]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # La versione di Go e' quella della riga toolchain di go.mod: mai download a sorpresa.
  GOTOOLCHAIN: local
  # go.mod e go.sum si cambiano solo con un commit, mai durante un build.
  GOFLAGS: -mod=readonly

jobs:
  segreti:
    name: segreti
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # l'azione elenca i commit della PR via API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scansiona i commit, non solo l'albero
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false" # niente permesso di scrittura sulle PR

  gosum:
    # Sul lab non c'e' Go: go.sum nasce e si aggiorna qui. Il job gira sempre
    # ed e' anche il controllo "go.mod e go.sum sono in ordine": se go mod tidy
    # cambierebbe qualcosa, carica i due file come artefatto e fallisce. Si
    # scarica l'artefatto (gh run download <id> -n gosum), si committa, si
    # rispinge.
    name: gosum
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GOFLAGS: "" # go mod tidy deve poter scrivere go.mod e go.sum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Versione di Go uguale alla riga toolchain di go.mod
        run: |
          atteso="$(sed -n 's/^toolchain //p' go.mod)"
          trovato="$(go env GOVERSION)"
          echo "go.mod: ${atteso} - runner: ${trovato}"
          test -n "${atteso}" && test "${atteso}" = "${trovato}"
      - name: go mod tidy
        id: tidy
        run: |
          cp go.mod "${RUNNER_TEMP}/go.mod.prima"
          if [ -f go.sum ]; then cp go.sum "${RUNNER_TEMP}/go.sum.prima"; else : > "${RUNNER_TEMP}/go.sum.prima"; fi
          go mod tidy
          go mod verify
          cambiato=false
          diff -u "${RUNNER_TEMP}/go.mod.prima" go.mod || cambiato=true
          diff -q "${RUNNER_TEMP}/go.sum.prima" go.sum || cambiato=true
          echo "cambiato=${cambiato}" >> "${GITHUB_OUTPUT}"
      - name: Carica go.mod e go.sum
        if: steps.tidy.outputs.cambiato == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gosum
          path: |
            go.mod
            go.sum
          if-no-files-found: error
          retention-days: 7
      - name: Fallisce se go.mod o go.sum non sono quelli committati
        if: steps.tidy.outputs.cambiato == 'true'
        run: |
          echo "::error::go mod tidy cambia go.mod/go.sum: scarica l'artefatto 'gosum' di questa run, committa i due file e rispingi."
          exit 1

  test:
    name: test
    needs: gosum
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1" # mattn/go-sqlite3 e -race
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      # -coverpkg=./...: senza, ogni pacchetto conta solo cio' che eseguono i
      # suoi test, e il codice del server (http/, service, ...) che TestContract
      # esercita da cmd/ risulterebbe allo 0%.
      - name: go test
        run: go test -race -shuffle=on -count=1 -coverpkg=./... -coverprofile="${RUNNER_TEMP}/cover.out" ./...
      # Informativo (REGOLE 6.1): nessuna soglia e mai rosso, anche se il passo
      # stesso si rompe. Totale e tabella per pacchetto nel log e nel riepilogo
      # della run; un blocco contato da piu' binari di test vale una volta.
      - name: Copertura (informativa, nessuna soglia)
        continue-on-error: true
        run: |
          set -euo pipefail
          profilo="${RUNNER_TEMP}/cover.out"
          {
            echo "### Copertura con -coverpkg=./... (nessuna soglia)"
            echo
            echo "Totale (go tool cover -func): $(go tool cover -func="${profilo}" | tail -n 1 | awk '{print $NF}')"
            echo
            echo "Le righe 0.0% di go test per i pacchetti senza test ignorano -coverpkg: vale questa tabella."
            echo
            echo "| Pacchetto | Istruzioni | Coperte | % |"
            echo "|---|---:|---:|---:|"
            awk -v modulo="$(go list -m)/" '
              $1 != "mode:" { n[$1] = $2; if ($3 > 0) coperto[$1] = 1 }
              END {
                for (b in n) {
                  p = b
                  sub(/\/[^\/]*$/, "", p)
                  if (index(p, modulo) == 1) p = substr(p, length(modulo) + 1)
                  tot[p] += n[b]
                  if (b in coperto) cop[p] += n[b]
                }
                for (p in tot) {
                  pct = tot[p] > 0 ? 100 * cop[p] / tot[p] : 0
                  printf "| %s | %d | %d | %.1f%% |\n", p, tot[p], cop[p], pct
                }
              }' "${profilo}" | sort
          } | tee -a "${GITHUB_STEP_SUMMARY}"

  # Vulnerabilita' note RAGGIUNTE dal nostro codice (REGOLE 6.3, 8 e 9).
  # Bloccante nel workflow (nessun continue-on-error): fallisce (exit 3) solo
  # su cio' che il codice chiama davvero. Ferma il merge solo se "govulncheck"
  # e' tra i controlli obbligatori del ruleset "remotek protetto".
  # Cio' che e' soltanto importato o richiesto non fa fallire il job: con
  # "-show verbose" resta elencato nel log (id, modulo, versione che corregge)
  # e si legge nella MR mensile build(deps).
  govulncheck:
    name: govulncheck
    needs: gosum
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Versione fissata: si alza con un commit, come le azioni.
      GOVULNCHECK_VERSION: v1.8.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # "go install pacchetto@versione" ignora il go.mod del repo: funziona anche
      # con GOFLAGS=-mod=readonly e GOTOOLCHAIN=local (provato in CI), quindi
      # l'ambiente del workflow resta quello di tutti gli altri job.
      - name: Installa govulncheck
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
      - name: govulncheck
        run: |
          "$(go env GOPATH)/bin/govulncheck" -show verbose ./...

  # Il Dockerfile (REGOLE 7): hadolint, poi docker build senza push, che
  # prova anche lo stadio del pannello (npm ci e build di rustdesk-api-web),
  # e un avvio del container: utente 10001, /api/version che risponde. Nessun
  # registry e nessun permesso di scrittura: l'immagine resta sul runner.
  immagine:
    name: immagine
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Binario della release di hadolint, verificato con lo sha256 di
      # checksums.sha256 della stessa release: si cambiano insieme.
      HADOLINT_VERSION: v2.15.1
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installa hadolint
        run: |
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  ${RUNNER_TEMP}/hadolint" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/hadolint"
      - name: hadolint
        run: '"${RUNNER_TEMP}/hadolint" Dockerfile'
      - name: docker build senza push
        run: docker build --build-arg VERSION=ci --build-arg REVISION="${GITHUB_SHA}" -t remotek-api:ci .
      - name: Il container parte, come 10001, e risponde
        run: |
          set -euo pipefail
          docker run -d --name api -p 127.0.0.1:21114:21114 remotek-api:ci
          test "$(docker exec api id -u):$(docker exec api id -g)" = "10001:10001"
          for _ in $(seq 30); do
            if curl -fsS http://127.0.0.1:21114/api/version; then echo; exit 0; fi
            sleep 1
          done
          docker logs api
          echo "::error::/api/version non risponde dopo 30 secondi"
          exit 1

  workflow-audit:
    name: workflow-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false # esito nel log, il job fallisce sui finding: niente security-events: write
          annotations: true

  # Bloccante, ma solo sui pacchetti gia' bonificati (.github/lint-bonificati.txt):
  # l'elenco si allarga a ogni MR di bonifica del Passo 3 fino a coprire tutto.
  lint:
    name: lint
    needs: gosum
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          install-only: true
      - name: La configurazione e' valida
        run: golangci-lint config verify
      - name: golangci-lint e formattazione sui pacchetti bonificati
        run: |
          set -euo pipefail
          mapfile -t cartelle < <(grep -v -e '^#' -e '^[[:space:]]*$' .github/lint-bonificati.txt || true)
          if [ "${#cartelle[@]}" -eq 0 ]; then
            echo "Nessun pacchetto bonificato in elenco: niente da controllare."
            exit 0
          fi
          pacchetti=(); sorgenti=()
          for c in "${cartelle[@]}"; do
            [ -d "$c" ] || { echo "::error::$c e' in lint-bonificati.txt ma non esiste"; exit 1; }
            pacchetti+=("./$c")
            sorgenti+=("$c"/*.go)
          done
          golangci-lint run "${pacchetti[@]}"
          golangci-lint fmt --diff "${sorgenti[@]}"

  # Informativo: tutto il repo, senza --new-from-rev. Non fallisce sui finding;
  # il conteggio per linter e per pacchetto va nel riepilogo della run e nella
  # descrizione della MR. I pacchetti a zero finding sono candidati a
  # lint-bonificati.txt.
  lint-tutto:
    name: lint-tutto
    needs: gosum
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          install-only: true
      - name: golangci-lint su tutto il repo
        run: |
          golangci-lint run --issues-exit-code=0 --max-issues-per-linter=0 --max-same-issues=0 \
            --output.json.path="${RUNNER_TEMP}/lint.json" --output.text.path=stdout ./...
      - name: File che gofmt/goimports cambierebbero
        run: |
          golangci-lint fmt --diff ./... > "${RUNNER_TEMP}/fmt.diff" || true
          grep -c '^diff ' "${RUNNER_TEMP}/fmt.diff" || true
          grep '^diff ' "${RUNNER_TEMP}/fmt.diff" | awk '{print $NF}' | sed 's#^b/##' > "${RUNNER_TEMP}/fmt.txt" || true
      - name: Riepilogo per linter e per pacchetto
        run: |
          go list -f '{{.Dir}}' ./... > "${RUNNER_TEMP}/pacchetti.txt"
          python3 .github/scripts/riepilogo-lint.py "${RUNNER_TEMP}/lint.json" "${RUNNER_TEMP}/pacchetti.txt" "${RUNNER_TEMP}/fmt.txt" | tee -a "${GITHUB_STEP_SUMMARY}"
